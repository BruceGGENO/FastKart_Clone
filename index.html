<!DOCTYPE html>
<html>

<head>
    <title>On Demand Last Mile Delivery</title>
    <link rel="icon" href="img/1_3.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <!--First Languages Nav-->
    <div class="w-screen h-10 bg-teal-600 text-white p-2 text-[14px] flex justify-between">
        <p class="ml-20">Welcome to FastKart! Wrap new offers/gift every single day on Weekends. <span
                class="font-bold">New Coupon Code: FAST024</span></p>
        <div class="mr-15">
            <select class="">
                <option class="text-black rounded-lg">
                    <div>
                        <img src="img/germany.png" class="h-10 w-10">
                        <p>English</p>
                    </div>
                </option>
                <option class="text-black">English</option>
                <option class="text-black">Germany</option>
                <option class="text-black">Turkey</option>
            </select>
            <select class="pl-2 border-l-1">
                <option>USD</option>
                <option>AUD</option>
                <option>EUR</option>
                <option>CNY</option>
            </select>
        </div>
    </div>

    <!--Logo Navbar-->
    <div class="flex m-25 mt-10 justify-between items-center">
        <img src="img/1.png" class="h-7 w-35">
        <div class="w-[60%] flex gap-3 items-center">
            <img src="img/3fef35f3-8e21-4f62-9ef6-92f0d4fece5e.svg" class="rounded-lg bg-gray-200 p-2">
            <div class="flex w-[90%] relative">
                <input type="text" placeholder="I'm searching for..."
                    class="w-[40%] border border-gray-200 rounded-lg p-3 w-[90%] focus:outline-green-500">
                <div
                    class="bg-orange-400 h-[100%] w-15 rounded-r-lg flex items-center justify-center absolute right-13">
                    <img src="img/13393ee5-d95a-4a4a-b722-e16309058937.svg" class="cursor-pointer">
                </div>
            </div>

        </div>
        <div class="">
            <ul class="flex gap-2">
                <li>
                    <img src="img/7a64f997-8339-4dd5-862d-b2da0d47ed1c.svg" class="border-r-1 pr-3 cursor-pointer">
                </li>
                <li>
                    <img src="img/01df404b-ff4c-4c70-ad86-8cfa26d5a941.svg" class="border-r-1 pr-3 cursor-pointer">

                </li>
                <li>
                    <img src="img/ff703145-6506-4f6b-b6f7-a14835b2db01.svg" class="border-r-1 pr-3 cursor-pointer">

                </li>
                <li>
                    <img src="img/fdd61b46-34cb-4db7-bab4-994ace6f78d5.svg" class="cursor-pointer cursor-pointer">

                </li>
            </ul>
        </div>
    </div>

    <!--First Categories Nav-->
    <div class="w-[85%] flex justify-between ml-25 items-center relative top-[-80px]">
        <!--All Categories-->
        <div class="bg-teal-500 p-4 w-50 text-white rounded-lg font-bold flex gap-2">
            <img src="img/365ea38f-2abb-4880-96fd-e203e96aa0c2.svg">
            <p class="text-[18px]">All Categories</p>
        </div>
        <!--Menu Links-->
        <div>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Home</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Shop</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Product</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Mega Menu</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Blog</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Pages</option>
            </select>
            <select class="hover:text-teal-700 p-3 text-[18px]">
                <option>Seller</option>
            </select>
        </div>
        <!--Popover flash button-->
        <div class="bg-teal-100 h-10 w-10 rounded-lg flex justify-center items-center">
            <img src="img/e67c6407-f493-4d33-b78e-0a212977cdc8.svg">
        </div>
    </div>

    <!--Sticky Privacy-->
    <div class="rounded-xl fixed bottom-10 right-10 w-45 flex font-bold">
        <p class="p-3">Privacy Policy</p>
        <p class="bg-teal-500 rounded-r-xl p-3 text-white">OK</p>
    </div>
</body>

</html>
